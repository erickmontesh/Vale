<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vale</title>
  <!-- Importar fuente Serif clásica y elegante desde Google Fonts (Playfair Display y Lora) -->
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,400&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Lora', Georgia, serif;
      background: linear-gradient(135deg, #e1bee7 0%, #ba68c8 50%, #8e24aa 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 1rem;
      position: relative;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      padding: 1.6rem 1.3rem;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(106, 27, 154, 0.22), 0 0 20px rgba(225, 190, 231, 0.5);
      text-align: center;
      max-width: 320px;
      width: 100%;
      position: relative;
      z-index: 10;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .snoopy-container {
      margin-bottom: 0.3rem;
      animation: float 3s ease-in-out infinite;
      display: flex;
      justify-content: center;
    }
    .snoopy-container img {
      width: 125px;
      height: auto;
      max-height: 150px;
      object-fit: contain;
    }

    /* Animación de flotación para textos e imágenes */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Animación de latido sutil para el botón de aceptar */
    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .card h1 { 
      font-family: 'Playfair Display', Georgia, serif; /* Serif clásica más marcada para títulos */
      color: #6a1b9a; 
      margin-bottom: 0.4rem; 
      font-size: 1.5rem; 
      font-weight: 800;
      animation: float 3.5s ease-in-out infinite;
    }
    .card p { 
      font-family: 'Lora', Georgia, serif;
      color: #4a148c; 
      margin-bottom: 1.2rem; 
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.3;
      animation: float 4s ease-in-out infinite;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      position: relative;
      min-height: 100px;
      justify-content: center;
    }
    button {
      font-family: 'Lora', Georgia, serif;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      max-width: 230px;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
    }
    .btn-yes {
      background-color: #8e24aa;
      color: white;
      box-shadow: 0 6px 18px rgba(142, 36, 170, 0.4);
      animation: pulseBtn 2.5s infinite ease-in-out;
    }
    .btn-yes:hover {
      background-color: #7b1fa2;
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(142, 36, 170, 0.5);
    }
    .btn-yes:active { 
      transform: scale(0.96); 
    }
    .btn-no {
      background-color: #e1bee7;
      color: #4a148c;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      z-index: 20;
    }
    .btn-no:hover {
      background-color: #ce93d8;
    }

    .card.hidden {
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
      position: absolute;
    }

    /* Estilos para los perritos de la pradera cayendo de fondo */
    .falling-dog {
      position: absolute;
      width: 40px; 
      height: auto;
      top: -50px;
      z-index: 1;
      pointer-events: none;
      animation: fallDog linear forwards;
    }
    @keyframes fallDog {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.85;
      }
    }

    /* Estilos para las partículas de confeti al aceptar */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #f0f;
      top: -10px;
      z-index: 30;
      opacity: 0.9;
      animation: fallConfetti linear forwards;
    }
    @keyframes fallConfetti {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Elemento de audio oculto para reproducir la canción al aceptar -->
  <audio id="successAudio" src="cancion.mp3" preload="auto"></audio>

  <!-- Tarjeta principal de invitación -->
  <div class="card" id="mainCard">
    <div class="snoopy-container">
      <img src="snoopy-helado.png" alt="Snoopy comiendo helado">
    </div>
    <h1>¡¡Ya casiii, Valeeee!!</h1>
    <p>Estás muy cerquita de la meta, y te mereces un descansooo. Me dejas invitarte un heladoooo? 🍦</p>
    
    <div class="buttons">
      <button class="btn-yes" onclick="accepted()">Siiii, vamoooos :)</button>
      <button class="btn-no" id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton(event)" onclick="moveButton(event)">Nooo puedooo :(</button>
    </div>
  </div>

  <!-- Tarjeta de éxito (al aceptar) -->
  <div class="card hidden" id="successCard">
    <div class="snoopy-container">
      <img src="snoopy-graduado.png" alt="Snoopy graduado">
    </div>
    <h1>¡¡Graciaaas, Valeee!! 🫶</h1>
    <p>Dime qué día tienes libreeee, y nos organizamoooos :)</p>
  </div>

  <script>
    function moveButton(e) {
      if (e) e.preventDefault();
      const btn = document.getElementById('noBtn');
      
      const padding = 20;
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      
      const btnWidth = btn.offsetWidth;
      const btnHeight = btn.offsetHeight;
      
      const maxX = screenWidth - btnWidth - padding;
      const maxY = screenHeight - btnHeight - padding;
      
      const x = Math.max(padding, Math.floor(Math.random() * maxX));
      const y = Math.max(padding, Math.floor(Math.random() * maxY));
      
      btn.style.position = 'fixed';
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    }

    // Lluvia constante de perritos de la pradera
    function createFallingDogs() {
      const dogCount = 18;

      for (let i = 0; i < dogCount; i++) {
        const dog = document.createElement('img');
        dog.src = 'perrito.png';
        dog.classList.add('falling-dog');
        
        dog.style.left = Math.random() * window.innerWidth + 'px';
        
        const size = Math.random() * 15 + 30;
        dog.style.width = size + 'px';
        
        const duration = Math.random() * 3 + 3;
        dog.style.animationDuration = duration + 's';
        dog.style.animationDelay = Math.random() * 3 + 's';

        document.body.appendChild(dog);

        setTimeout(() => {
          dog.remove();
        }, (duration + 3) * 1000);
      }
    }

    window.onload = () => {
      createFallingDogs();
      setInterval(createFallingDogs, 4000);
    };

    // Función de confeti al aceptar
    function createConfetti() {
      const colors = ['#8e24aa', '#ab47bc', '#ce93d8', '#ff4081', '#ffd54f', '#4db6ac'];
      const confettiCount = 60;

      for (let i = 0; i < confettiCount; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        const size = Math.random() * 8 + 6;
        confetti.style.width = size + 'px';
        confetti.style.height = size + 'px';
        
        if (Math.random() > 0.5) {
          confetti.style.borderRadius = '50%';
        }
        
        const duration = Math.random() * 2 + 2;
        confetti.style.animationDuration = duration + 's';
        confetti.style.animationDelay = Math.random() * 0.5 + 's';

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, (duration + 0.5) * 1000);
      }
    }

    function accepted() {
      const audio = document.getElementById('successAudio');
      audio.play().catch(error => {
        console.log("El navegador bloqueó la reproducción automática de audio:", error);
      });

      createConfetti();
      
      const mainCard = document.getElementById('mainCard');
      const successCard = document.getElementById('successCard');

      mainCard.classList.add('hidden');
      
      setTimeout(() => {
        successCard.classList.remove('hidden');
      }, 200);
    }
  </script>
</body>
</html>
